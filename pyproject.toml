[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hobomaxxing"
version = "0.1.0"
description = "Local-first, free-service-aware task inventory and automation planner"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
hobo = "hobomax.cli:main"

[tool.setuptools.packages.find]
include = ["hobomax*"]
