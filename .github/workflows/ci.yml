name: Flow CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Flow compiler
        uses: actions/checkout@v4
        with:
          repository: flooooooooooow/flow
          ref: main
          path: _flow
      - name: Compile and run Flow tests
        run: ./_flow/flow run src/test_engine.flow
      - name: Offline CLI smoke test
        run: |
          FLOW_BUILD_ROOT=build ./_flow/flow compile src/main.flow
          ./build/main --offline plan --config config.example.conf
      - name: Offline dashboard smoke test
        run: ./build/main --offline dashboard --no-open --config config.example.conf
      - name: Reject Python application files
        run: |
          if find src ui -type f -name '*.py' | grep -q .; then
            echo "Python application source is forbidden"
            exit 1
          fi
